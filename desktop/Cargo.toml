[package]
name = "procraft-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "ProCraft on the desktop (Windows, macOS, Linux): the same engine and canvas, with an egui interface"

[[bin]]
name = "procraft"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
procraft-core = { path = "../crates/core" }
procraft-engine = { workspace = true }
procraft-gpu = { workspace = true }
log = { workspace = true }
env_logger = { version = "0.11", default-features = false, features = ["auto-color"] }
egui = { version = "0.37", features = ["default_fonts"] }
egui-winit = "0.37"
egui-wgpu = { version = "0.37", default-features = false }
winit = "0.30"
rfd = "0.17"
# Pictures pasted into the source editor (egui already brings it in, with images)
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
resvg = { version = "0.49", default-features = false }
png = { workspace = true }
# Photo's pictures (the clipboard already brings it in, with PNG and TIFF)
# Canvas information's dates, in local time
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { workspace = true, features = ["metal"] }
# A tablet's pen on a Mac, which winit gives as the mouse: its pressure, tilt and eraser end from
# the system's tablet events; files opened from the Finder (AppKit, through the bindings winit and
# rfd already bring in)
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "NSApplication",
    "NSEvent",
    "NSResponder",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSDictionary",
    "NSEnumerator",
    "NSError",
    "NSObject",
    "NSString",
    "NSURL",
    "NSValue",
] }
# Animated MP4 and HEVC, and videos opened as frames, through the system's own encoders and
# decoders (AVFoundation)
objc2-av-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "objc2-core-media",
    "objc2-core-video",
    "AVAsset",
    "AVAssetReader",
    "AVAssetReaderOutput",
    "AVAssetTrack",
    "AVAssetWriter",
    "AVAssetWriterInput",
    "AVMediaFormat",
    "AVVideoSettings",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "CFCGTypes",
    "CFString",
    "CFURL",
] }
# The fonts for other scripts found by family (Core Text), and their faces in a collection
objc2-core-text = { version = "0.3", default-features = false, features = ["std", "CTFont", "CTFontDescriptor"] }
swash = "0.2"
# A PDF's pages drawn by the system's renderer (Core Graphics)
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std",
    "CGBitmapContext",
    "CGColorSpace",
    "CGContext",
    "CGImage",
    "CGPDFDocument",
    "CGPDFPage",
] }
objc2-core-media = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-video",
    "CMBase",
    "CMFormatDescription",
    "CMSampleBuffer",
    "CMTime",
] }
objc2-core-video = { version = "0.3", default-features = false, features = [
    "std",
    "CVBase",
    "CVBuffer",
    "CVImageBuffer",
    "CVPixelBuffer",
    "CVPixelBufferPool",
    "CVReturn",
] }

# An artwork dragged out of the gallery, handed to the system as a file
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
drag = "2.1"

# Animated MP4 and HEVC through the system's own encoders (Media Foundation); Feedback Sounds'
# click played by the system (PlaySound); a PDF's pages drawn by the system's renderer; a pen's
# lean from the pointer messages
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Data_Pdf",
    "Storage_Streams",
    "UI",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_UI_Input_Pointer",
    "Win32_UI_WindowsAndMessaging",
] }

# A tablet's pen under X11, which winit gives as the mouse: its pressure, lean and eraser end from
# its own XInput 2 events
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb = { version = "0.13", features = ["xinput"] }

# A pen on Wayland, which winit leaves to the compositor's mouse: the tablet protocol read on
# winit's own connection (the versions winit already brings in)
[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
rustix = { version = "1", default-features = false, features = ["std", "event"] }

[build-dependencies]
winresource = "0.1"
