[package]
name = "procraft-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "ProCraft on the desktop (Windows, macOS, Linux): the same engine and canvas, with an egui interface"

[[bin]]
name = "procraft"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
procraft-core = { path = "../crates/core" }
procraft-engine = { workspace = true }
procraft-gpu = { workspace = true }
log = { workspace = true }
env_logger = { version = "0.11", default-features = false, features = ["auto-color"] }
egui = { version = "0.37", features = ["default_fonts"] }
egui-winit = "0.37"
egui-wgpu = { version = "0.37", default-features = false }
winit = "0.30"
rfd = "0.17"
# Pictures pasted into the source editor (egui already brings it in, with images)
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
resvg = { version = "0.49", default-features = false }
png = { workspace = true }
# Photo's pictures (the clipboard already brings it in, with PNG and TIFF)
# Canvas information's dates, in local time
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { workspace = true, features = ["metal"] }

# Animated MP4 and HEVC through the system's own encoders (Media Foundation); Feedback Sounds'
# click played by the system (PlaySound); a PDF's pages drawn by the system's renderer; a pen's
# lean from the pointer messages
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Data_Pdf",
    "Storage_Streams",
    "UI",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_UI_Input_Pointer",
    "Win32_UI_WindowsAndMessaging",
] }
# An artwork dragged out of the gallery, handed to the system as a file
drag = "2.1"
