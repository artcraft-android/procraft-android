[package]
name = "procraft-gpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "ProCraft's GPU renderer (wgpu): layer pixels, stroke rendering, compositing and presenting the canvas"

[lints]
workspace = true

[dependencies]
procraft-engine = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true }
pollster = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }

# OpenGL ES where a device's Vulkan is missing or can't make a device
[target.'cfg(target_os = "android")'.dependencies]
wgpu = { workspace = true, features = ["gles"] }

# OpenGL on Windows where neither Vulkan nor Direct3D 12 makes a device (an older GPU or driver)
[target.'cfg(windows)'.dependencies]
wgpu = { workspace = true, features = ["gles"] }

# OpenGL on Linux where Vulkan makes no device (an older GPU or driver)
[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { workspace = true, features = ["gles"] }

# Metal on Apple's systems (the iPad app's core, the Mac's desktop app)
[target.'cfg(target_vendor = "apple")'.dependencies]
wgpu = { workspace = true, features = ["metal"] }
