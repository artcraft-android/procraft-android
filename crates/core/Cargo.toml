[package]
name = "procraft-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "The session both ProCraft apps drive: a canvas painted with the engine and drawn by the renderer, with the Android app's Kotlin bindings (UniFFI)"

[lib]
name = "procraft_core"
# cdylib: the library the Android app loads; lib: the desktop app and the tests
crate-type = ["cdylib", "lib"]

[lints]
workspace = true

[dependencies]
procraft-engine = { workspace = true }
procraft-gpu = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
png = { workspace = true }
parking_lot = { workspace = true }
# The exact version: the Kotlin bindings are generated by the same release (bindgen/, sharing this
# lock file) and refuse to load against another one.
uniffi = { version = "=0.32.2", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = { version = "0.15", default-features = false }
ndk = { version = "0.9", default-features = false }
jni-sys = "0.3"
raw-window-handle = "0.6"
