[package]
name = "procraft-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "The session the ProCraft apps drive: a canvas painted with the engine and drawn by the renderer, with the Android app's Kotlin bindings and the iPad app's Swift ones (UniFFI)"

[lib]
name = "procraft_core"
# cdylib: the library the Android app loads; lib: the desktop app and the tests (the iPad app's
# static library is built from it with `cargo rustc --crate-type staticlib`, ios/build-rust.sh)
crate-type = ["cdylib", "lib"]

[lints]
workspace = true

[dependencies]
procraft-engine = { workspace = true }
procraft-gpu = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
# waits for the GPU to say whether the window's surface took its configuration
pollster = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
png = { workspace = true }
# the time-lapse's frames, kept as JPEG; a model's textures, PNG or JPEG
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# text laid out and drawn alike in both apps: shaping, wrapping and glyphs, and the outline's stroke
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash"] }
swash = "0.2"
# Vertical text a letter (a grapheme: a letter with its marks, an emoji as joined) a line
unicode-segmentation = "1"
parking_lot = { workspace = true }
# The exact version: the Kotlin bindings are generated by the same release (bindgen/, sharing this
# lock file) and refuse to load against another one.
uniffi = { version = "=0.32.2", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = { version = "0.15", default-features = false }
ndk = { version = "0.9", default-features = false }
jni-sys = "0.3"
raw-window-handle = "0.6"

# The iPad app's CAMetalLayer, handed over from Swift (layer.rs)
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
