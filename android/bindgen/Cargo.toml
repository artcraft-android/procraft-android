[package]
name = "procraft-bindgen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "uniffi-bindgen for procraft-core: generates its Kotlin and Swift bindings from the built library (the Android and iPad builds run it)"

[[bin]]
name = "uniffi-bindgen"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# The release procraft-core uses (same lock file): bindings only load against their own release.
uniffi = { version = "=0.32.2", features = ["cli"] }
