[package]
name = "tweening"
version = "1.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "A plugin for ProCraft: in-between frames in Animation Assist"

[lib]
crate-type = ["cdylib"]

[dependencies]
kit = { package = "procraft-plugin-kit", path = "../kit" }

# Not a member of the app's workspace, and linked into nothing: it builds to a module of its own.
[workspace]

[profile.release]
opt-level = 3
lto = true
panic = "abort"
strip = true
