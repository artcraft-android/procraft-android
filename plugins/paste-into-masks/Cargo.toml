[package]
name = "paste-into-masks"
version = "1.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "A plugin for ProCraft: Paste puts the picture's brightness into the current mask"

[lib]
crate-type = ["cdylib"]

# Not a member of the app's workspace, and linked into nothing: it builds to a module of its own.
[workspace]

[profile.release]
opt-level = 3
lto = true
panic = "abort"
strip = true
