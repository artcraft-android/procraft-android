[package]
name = "procraft-android"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "ProCraft on Android: the engine and renderer as a native library with Kotlin bindings (UniFFI); the app is in android/"

[lib]
name = "procraft_android"
# cdylib: the library the app loads; lib: the tests
crate-type = ["cdylib", "lib"]

[lints]
workspace = true

[dependencies]
procraft-engine = { workspace = true }
procraft-gpu = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
png = { workspace = true }
parking_lot = { workspace = true }
# The exact version: the Kotlin bindings are generated by the same release (bindgen/, sharing this
# lock file) and refuse to load against another one.
uniffi = { version = "=0.32.2", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = { version = "0.15", default-features = false }
ndk = { version = "0.9", default-features = false }
jni-sys = "0.3"
raw-window-handle = "0.6"
