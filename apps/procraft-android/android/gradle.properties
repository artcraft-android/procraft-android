org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# The Rust library's ABIs: arm64-v8a for devices, x86_64 for the emulator. Build one to save time,
# e.g. `./gradlew assembleRelease -Pprocraft.abis=arm64-v8a`.
procraft.abis=arm64-v8a,x86_64

procraft.version=0.0.1
procraft.versionCode=1
