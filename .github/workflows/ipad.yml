# The iPad app while it is being made: each push to the `ipad` branch builds its unsigned .ipa
# (ios/build-ipa.sh), kept as the run's artifact. Nothing is released. Public repository only (a
# private one pays for macOS runners' minutes).
name: iPad

on:
  push:
    branches: [ipad]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ipad-${{ github.ref }}
  # a newer push's build replaces one still running
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_VERSION: "1.99.0"

jobs:
  ipa:
    name: iPadOS (unsigned IPA)
    if: ${{ !github.event.repository.private }}
    runs-on: macos-15
    env:
      DIST: ${{ github.workspace }}/dist
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          key: ipad

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build the IPA
        run: bash ios/build-ipa.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ipados-work-in-progress
          path: dist/*
          if-no-files-found: error

  # the app on the iPad mini simulator (the reference's model), each screen captured, to compare
  screens:
    name: iPad screens (simulator)
    if: ${{ !github.event.repository.private }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2
        with:
          key: ipad-simulator

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build for the simulator
        run: |
          bash ios/build-rust.sh iphonesimulator
          (cd ios && xcodegen generate --spec project.yml)
          # the core is built for Apple silicon's simulator only
          xcodebuild -project ios/ProCraft.xcodeproj -scheme ProCraft -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/simulator build \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO >build-simulator.log 2>&1 \
            || { grep -E "error|failed" build-simulator.log | head -60; exit 1; }

      - name: Capture the screens
        run: |
          uuid_of() { grep -m1 -o '[0-9A-F]\{8\}-[0-9A-F]\{4\}-[0-9A-F]\{4\}-[0-9A-F]\{4\}-[0-9A-F]\{12\}'; }
          device=$(xcrun simctl list devices available | grep 'iPad mini (A17 Pro)' | uuid_of)
          [ -n "$device" ] || device=$(xcrun simctl list devices available | grep 'iPad' | uuid_of)
          xcrun simctl list devices available | grep iPad | head -5 >>"$GITHUB_STEP_SUMMARY"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" "$(find build/simulator -name ProCraft.app -path '*iphonesimulator*' | head -1)"
          mkdir -p screens
          studio="studio studio-taper studio-grain studio-stylus studio-materials studio-preview studio-about studio-roundness studio-tilt studio-landscape"
          over="keypad keypad-pressure keypad-tilt blend-list node-menu pad-menu"
          source="source source-shape source-import repeat source-library source-landscape"
          library="library-add library-set-menu library-icons library-search library-swipe library-recent"
          layers="layers-many layers-swipe layers-options layers-blend layers-menu layers-rename layers-picked"
          colours="colors-classic colors-harmony colors-harmony-menu colors-value colors-hex colors-palettes colors-add colors-palette-menu colors-background"
          for screen in gallery canvas brushes layers colors actions adjustments $studio $over $source $library $layers $colours; do
            xcrun simctl launch --terminate-running-process "$device" io.github.artcraftandroid.procraft -screen "$screen"
            sleep 10
            xcrun simctl io "$device" screenshot "screens/$screen.png"
          done
          ls -l screens >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ipad-screens
          path: screens/*
          if-no-files-found: error
