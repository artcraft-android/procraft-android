# The iPad app while it is being made: each push to the `ipad` branch builds its unsigned .ipa
# (ios/build-ipa.sh), kept as the run's artifact. Nothing is released. Public repository only (a
# private one pays for macOS runners' minutes).
name: iPad

on:
  push:
    branches: [ipad]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ipad-${{ github.ref }}
  # a newer push's build replaces one still running
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_VERSION: "1.99.0"

jobs:
  ipa:
    name: iPadOS (unsigned IPA)
    if: ${{ !github.event.repository.private }}
    runs-on: macos-15
    env:
      DIST: ${{ github.workspace }}/dist
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          key: ipad

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build the IPA
        run: bash ios/build-ipa.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ipados-work-in-progress
          path: dist/*
          if-no-files-found: error
