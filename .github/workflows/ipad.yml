# The iPad app while it is being made: each push to the `ipad` branch builds its unsigned .ipa
# (ios/build-ipa.sh), kept as the run's artifact. Nothing is released. Public repository only (a
# private one pays for macOS runners' minutes).
name: iPad

on:
  push:
    branches: [ipad]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ipad-${{ github.ref }}
  # a newer push's build replaces one still running
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_VERSION: "1.99.0"

jobs:
  ipa:
    name: iPadOS (unsigned IPA)
    if: ${{ !github.event.repository.private }}
    runs-on: macos-15
    env:
      DIST: ${{ github.workspace }}/dist
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          key: ipad

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build the IPA
        run: bash ios/build-ipa.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ipados-work-in-progress
          path: dist/*
          if-no-files-found: error

  # plugin filters' GPU path on Metal, which nothing else here runs it on. A test with no GPU says
  # "skipped" and passes, so this job's colour means nothing: its summary says what ran. The hostile
  # tests are ignored elsewhere to spare a machine's driver; a runner has none to spare, so they run
  # here, cut off if a guard fails to.
  metal:
    name: Plugin filters on Metal
    if: ${{ !github.event.repository.private }}
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ipad-metal

      - name: The Metal device
        run: |
          cat >device.swift <<'SWIFT'
          import Metal
          if let d = MTLCreateSystemDefaultDevice() {
              print("Metal device: \(d.name), unified memory \(d.hasUnifiedMemory), Apple7 \(d.supportsFamily(.apple7))")
          } else {
              print("Metal device: none")
          }
          SWIFT
          xcrun swift device.swift | tee metal.log
          cat metal.log >>"$GITHUB_STEP_SUMMARY"

      - name: Build the tests
        run: cargo test -p procraft-gpu -p procraft-core --no-run

      - name: The filter tests
        continue-on-error: true
        run: |
          set -o pipefail
          cargo test -p procraft-gpu --test plugin_filter -- --nocapture --test-threads=1 2>&1 | tee gpu.log
          cargo test -p procraft-core plugin_filter -- --nocapture --test-threads=1 2>&1 | tee -a gpu.log

      - name: The hostile filter tests
        continue-on-error: true
        run: |
          set -o pipefail
          perl -e 'alarm 420; exec @ARGV' cargo test -p procraft-gpu --test plugin_filter -- --ignored --nocapture --test-threads=1 2>&1 | tee hostile.log

      - name: What ran
        if: always()
        run: |
          for log in gpu.log hostile.log; do
            [ -f "$log" ] || { echo "$log: none" >>"$GITHUB_STEP_SUMMARY"; continue; }
            echo "$log: $(grep -c 'skipped:' "$log") skipped" >>"$GITHUB_STEP_SUMMARY"
            grep -E '^test result|FAILED|panicked|^test .* \.\.\. ' "$log" >>"$GITHUB_STEP_SUMMARY" || true
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metal-tests
          path: "*.log"
          if-no-files-found: warn

  # the app on the iPad mini simulator (the reference's model), each screen captured, to compare
  screens:
    name: iPad screens (simulator)
    if: ${{ !github.event.repository.private }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2
        with:
          key: ipad-simulator

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build for the simulator
        run: |
          bash ios/build-rust.sh iphonesimulator
          (cd ios && xcodegen generate --spec project.yml)
          # the core is built for Apple silicon's simulator only
          xcodebuild -project ios/ProCraft.xcodeproj -scheme ProCraft -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/simulator build \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO >build-simulator.log 2>&1 \
            || { grep -E "error|failed" build-simulator.log | head -60; exit 1; }

      - name: Capture the screens
        run: |
          uuid_of() { grep -m1 -o '[0-9A-F]\{8\}-[0-9A-F]\{4\}-[0-9A-F]\{4\}-[0-9A-F]\{4\}-[0-9A-F]\{12\}'; }
          device=$(xcrun simctl list devices available | grep 'iPad mini (A17 Pro)' | uuid_of)
          [ -n "$device" ] || device=$(xcrun simctl list devices available | grep 'iPad' | uuid_of)
          xcrun simctl list devices available | grep iPad | head -5 >>"$GITHUB_STEP_SUMMARY"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" "$(find build/simulator -name ProCraft.app -path '*iphonesimulator*' | head -1)"
          mkdir -p screens
          studio="studio studio-taper studio-grain studio-stylus studio-materials studio-preview studio-about studio-roundness studio-tilt studio-landscape"
          over="keypad keypad-pressure keypad-tilt blend-list node-menu pad-menu"
          source="source source-shape source-import repeat source-library source-landscape"
          library="library-add library-set-menu library-icons library-search library-swipe library-recent"
          layers="layers-many layers-swipe layers-options layers-blend layers-menu layers-rename layers-picked"
          colours="colors-classic colors-harmony colors-harmony-menu colors-value colors-hex colors-palettes colors-add colors-palette-menu colors-background"
          settings="prefs prefs-cursor prefs-pressure gestures gestures-hover gestures-general"
          adjusting="liquify liquify-mode liquify-twirl adjust-menu adjust-modes effect-hsb effect-balance effect-curves effect-glitch effect-noise effect-bloom effect-halftone effect-chromatic effect-perspective effect-gradient effect-gradient-edit effect-gradient-stop effect-gradient-stop-classic effect-gradient-stop-harmony effect-gradient-stop-value effect-gradient-stop-palettes"
          quick="quick-menu quick-menus quick-picker copy-paste"
          tools="transform transform-snapping transform-interpolation transform-warp transform-numeric selection selection-feather selection-saved crop crop-settings recolor layer-opacity guide guide-edit guide-symmetry text text-style canvas-info licences"
          shelf="gallery-select gallery-swipe gallery-new gallery-formats gallery-rename gallery-custom gallery-custom-colour gallery-preview gallery-preview-controls gallery-pinch gallery-drag gallery-more gallery-about gallery-recovery"
          fitted="interface-small interface-large reference reference-bars reference-image"
          for screen in gallery canvas brushes layers colors actions adjustments $studio $over $source $library $layers $colours $settings $adjusting $quick $tools $shelf $fitted; do
            xcrun simctl launch --terminate-running-process "$device" io.github.artcraftandroid.procraft -screen "$screen"
            sleep 10
            xcrun simctl io "$device" screenshot "screens/$screen.png"
          done
          ls -l screens >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ipad-screens
          path: screens/*
          if-no-files-found: error
