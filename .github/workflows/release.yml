# Release pipeline: pushing a version tag (v0.0.1-beta, v0.2.0, v1.0.0-rc.1, …) builds, and makes a
# draft GitHub release named after the tag (with an empty "What's Changed" section: fill it in on
# GitHub and publish the draft) of:
#
#   procraft-<version>-android-arm64.apk          64-bit ARM tablets, signed with the release key
#   procraft-<version>-android-legacy-arm32.apk   older 32-bit ARM tablets, signed likewise (named to list after arm64)
#   procraft-<version>-windows-x64.msi            the desktop app's installer (packaging/windows)
#   procraft-<version>-windows-x64-portable.zip   the desktop app to run from anywhere
#   procraft-<version>-windows-arm64.msi          the same for Windows on ARM (Snapdragon PCs)
#   procraft-<version>-windows-arm64-portable.zip
#   procraft-<version>-linux-x86_64.AppImage      any distro (packaging/linux)
#   procraft-<version>-linux-x86_64.deb           Debian, Ubuntu and the like
#   procraft-<version>-linux-x86_64.tar.gz        the plain tree
#   procraft-<version>-macos-universal.dmg        Apple silicon and Intel Macs (packaging/macos):
#                                                 signed with a Developer ID and notarized when
#                                                 the APPLE_* secrets exist, else ad hoc
#   procraft-<version>-harmonyos-arm64.hap        HarmonyOS 5.0.3+ tablets (harmony/), signed with
#                                                 the HARMONY_* secrets (harmony/SIGNING.md); without
#                                                 them …-harmonyos-arm64-unsigned.hap, which installs
#                                                 once signed with one's own Huawei account
#   SHA256SUMS.txt                                each file's SHA-256
#
# The Mac file is built on the public repository alone (a private one pays for macOS runners'
# minutes, ten times Linux's), and only once the repository's variable RELEASE_MAC is true. The
# HarmonyOS file likewise, once RELEASE_HARMONY is true (with HARMONY_TOOLS_URL set; the signing
# secrets are optional). While they are new, their failing leaves their file out rather than
# holding up the release; so does Windows on ARM's.
#
# A manual run (Actions › Release › Run workflow) is a dry run: it builds them at the version in
# gradle.properties and keeps them as the run's artifacts, and releases nothing. It also builds
# the iPad app's unsigned .ipa (ios/), which stays out of releases until that app is finished, and
# (with RELEASE_HARMONY and the signing secrets) the HarmonyOS app's unsigned .hap beside the signed
# one.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # never cancel a release halfway; a newer push waits its turn
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_VERSION: "1.99.0"
  NDK_VERSION: "29.0.14206865"

jobs:
  apk:
    name: APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - id: v
        name: Resolve version
        run: |
          listed="$(sed -n 's/^procraft\.version=//p' android/gradle.properties)"
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="$listed"; fi
          if ! printf '%s' "$v" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "::error::'$v' is not a version like 1.2.3 or 1.2.3-beta"
            exit 1
          fi
          # the tag must be the version gradle.properties names
          if [ "$v" != "$listed" ]; then
            echo "::error::the tag is v$v but gradle.properties says procraft.version=$listed: set it (and procraft.versionCode) before tagging"
            exit 1
          fi
          echo "version=$v" >>"$GITHUB_OUTPUT"
          echo "### v$v (\`${GITHUB_SHA::9}\`)" >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android, armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-android

      - name: Install cargo-ndk and the Android NDK
        run: |
          cargo install cargo-ndk --version "^4" --locked
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >>"$GITHUB_ENV"

      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.PROCRAFT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d >"$RUNNER_TEMP/release.p12"
            echo "PROCRAFT_KEYSTORE=$RUNNER_TEMP/release.p12" >>"$GITHUB_ENV"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "::error::No release key: a release is never signed with the debug key"
            exit 1
          else
            echo "::warning::No release key: this dry run is signed with the debug key"
          fi

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        working-directory: android
        env:
          VERSION: ${{ steps.v.outputs.version }}
          PROCRAFT_KEYSTORE_PASSWORD: ${{ secrets.PROCRAFT_KEYSTORE_PASSWORD }}
          PROCRAFT_KEY_ALIAS: ${{ secrets.PROCRAFT_KEY_ALIAS }}
          PROCRAFT_KEY_PASSWORD: ${{ secrets.PROCRAFT_KEY_PASSWORD }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          for build in arm64-v8a:arm64 armeabi-v7a:legacy-arm32; do
            ./gradlew --no-daemon :app:assembleRelease "-Pprocraft.abis=${build%:*}" "-Pprocraft.version=$VERSION"
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/dist/procraft-$VERSION-android-${build#*:}.apk"
          done

      - name: APK
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          echo >>"$GITHUB_STEP_SUMMARY"
          for apk in dist/*.apk; do
            certs="$("$apksigner" verify --print-certs "$apk")"
            if [ "$GITHUB_REF_TYPE" = tag ] && grep -q "CN=Android Debug" <<<"$certs"; then
              echo "::error::$apk is signed with the debug key"
              exit 1
            fi
            {
              echo "    $(basename "$apk")"
              grep -E "certificate (DN|SHA-256)" <<<"$certs" | sed 's/^/      /'
            } >>"$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: dist/*
          if-no-files-found: error

      - name: Remove the release key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"

  desktop:
    name: Desktop (${{ matrix.name }})
    strategy:
      matrix:
        include:
          - name: windows-x64
            os: windows-2025
          # an older Ubuntu, so the binary runs on any distro with glibc 2.35 or newer
          - name: linux-x86_64
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      DIST: ${{ github.workspace }}/dist
    steps:
      - uses: actions/checkout@v4

      - id: v
        name: Resolve version
        run: |
          listed="$(sed -n 's/^procraft\.version=//p' android/gradle.properties | tr -d '\r')"
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="$listed"; fi
          echo "version=$v" >>"$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-desktop-${{ matrix.name }}

      - name: Install WiX v5
        if: runner.os == 'Windows'
        run: |
          dotnet tool install --global wix --version 5.0.2
          echo "$USERPROFILE/.dotnet/tools" >>"$GITHUB_PATH"
          "$USERPROFILE/.dotnet/tools/wix" extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2

      - name: Package for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: ./packaging/windows/package.ps1

      - name: Install nfpm
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_Linux_x86_64.tar.gz | tar -xz -C "$RUNNER_TEMP" nfpm
          sudo install -m755 "$RUNNER_TEMP/nfpm" /usr/local/bin/nfpm
          sudo apt-get install -y --no-install-recommends desktop-file-utils >/dev/null

      - name: Package for Linux
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: bash packaging/linux/package.sh

      - name: Files
        run: ls -l dist >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: release-desktop-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  macos:
    name: Desktop (macos-universal)
    # only once the Mac app is to ship: the repository's variable RELEASE_MAC set to true
    if: ${{ !github.event.repository.private && vars.RELEASE_MAC == 'true' }}
    continue-on-error: true
    runs-on: macos-15
    env:
      DIST: ${{ github.workspace }}/dist
    steps:
      - uses: actions/checkout@v4

      - id: v
        name: Resolve version
        run: |
          listed="$(sed -n 's/^procraft\.version=//p' android/gradle.properties | tr -d '\r')"
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="$listed"; fi
          echo "version=$v" >>"$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-desktop-macos-universal

      - name: Set up Developer ID signing and notarization
        # without the secrets (forks, dry runs) the app stays signed ad hoc, not notarized
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bash packaging/macos/signing.sh --setup

      - name: Package for macOS
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: bash packaging/macos/package.sh

      - name: Remove the signing keychain and key
        if: always()
        run: bash packaging/macos/signing.sh --cleanup

      - name: Files
        run: ls -l dist >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: release-desktop-macos-universal
          path: dist/*
          if-no-files-found: error

  # HarmonyOS: the desktop app's interface in the canvas component (harmony/), built with Huawei's
  # command-line tools (the maintainer's own copy: their download needs a Huawei ID) and signed
  # with the certificate and profile AppGallery Connect issued (harmony/SIGNING.md)
  harmony:
    name: HarmonyOS (arm64)
    # only once the HarmonyOS app is to ship: the repository's variable RELEASE_HARMONY set to true
    if: ${{ !github.event.repository.private && vars.RELEASE_HARMONY == 'true' }}
    continue-on-error: true
    runs-on: ubuntu-24.04
    env:
      DIST: ${{ github.workspace }}/dist
      # signed with the signing secrets; without them the release carries the unsigned .hap
      SIGNED: ${{ secrets.HARMONY_P12 != '' && secrets.HARMONY_CER != '' && secrets.HARMONY_P7B != '' }}
    steps:
      - uses: actions/checkout@v4

      - id: v
        name: Resolve version
        run: |
          listed="$(sed -n 's/^procraft\.version=//p' android/gradle.properties | tr -d '\r')"
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="$listed"; fi
          echo "version=$v" >>"$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-unknown-linux-ohos

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-harmonyos

      # hvigor's tools run on Java (21 for the 26.0 tools and later); its texture compression needs
      # libGL
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Runner dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 unzip

      - name: Huawei's command-line tools
        env:
          HARMONY_TOOLS_URL: ${{ secrets.HARMONY_TOOLS_URL }}
          HARMONY_TOOLS_SHA256: ${{ vars.HARMONY_TOOLS_SHA256 }}
        run: bash harmony/ci-tools.sh

      - name: The native library and the icons
        run: bash harmony/build-rust.sh arm64

      - name: The .hap, unsigned
        working-directory: harmony/app
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          ohpm install
          hvigorw assembleHap --mode module -p module=entry@default -p product=default -p buildMode=release --no-daemon
          unsigned="$(find entry/build -name '*-unsigned.hap' | head -n 1)"
          test -n "$unsigned"
          mkdir -p "$GITHUB_WORKSPACE/unsigned"
          cp "$unsigned" "$GITHUB_WORKSPACE/unsigned/procraft-$VERSION-harmonyos-arm64-unsigned.hap"

      # no signing secrets: the release carries the unsigned .hap, which installs once someone signs
      # it with their own Huawei account (harmony/README.md)
      - name: The unsigned .hap as the release's
        if: env.SIGNED != 'true'
        run: |
          mkdir -p "$DIST"
          cp unsigned/*.hap "$DIST/"

      # signed, a dry run keeps the unsigned .hap beside it
      - uses: actions/upload-artifact@v4
        if: env.SIGNED == 'true' && github.event_name == 'workflow_dispatch'
        with:
          name: harmonyos-unsigned
          path: unsigned/*
          if-no-files-found: error

      - name: Sign the .hap
        if: env.SIGNED == 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
          HARMONY_P12: ${{ secrets.HARMONY_P12 }}
          HARMONY_CER: ${{ secrets.HARMONY_CER }}
          HARMONY_P7B: ${{ secrets.HARMONY_P7B }}
          HARMONY_KEY_ALIAS: ${{ secrets.HARMONY_KEY_ALIAS }}
          HARMONY_KEY_PASSWORD: ${{ secrets.HARMONY_KEY_PASSWORD }}
          HARMONY_STORE_PASSWORD: ${{ secrets.HARMONY_STORE_PASSWORD }}
        run: |
          keys="$RUNNER_TEMP/harmony-keys"
          mkdir -p "$keys" "$DIST"
          printf '%s' "$HARMONY_P12" | base64 -d >"$keys/signing.p12"
          printf '%s' "$HARMONY_CER" | base64 -d >"$keys/signing.cer"
          printf '%s' "$HARMONY_P7B" | base64 -d >"$keys/signing.p7b"
          hap="$DIST/procraft-$VERSION-harmonyos-arm64.hap"
          java -jar "$HAP_SIGN_TOOL" sign-app -mode localSign -signAlg SHA256withECDSA \
            -keyAlias "$HARMONY_KEY_ALIAS" -keyPwd "$HARMONY_KEY_PASSWORD" \
            -keystoreFile "$keys/signing.p12" -keystorePwd "$HARMONY_STORE_PASSWORD" \
            -appCertFile "$keys/signing.cer" -profileFile "$keys/signing.p7b" \
            -inFile "unsigned/procraft-$VERSION-harmonyos-arm64-unsigned.hap" -outFile "$hap"
          java -jar "$HAP_SIGN_TOOL" verify-app -inFile "$hap" \
            -outCertchain "$keys/chain.cer" -outProfile "$keys/profile.p7b"

      - name: Remove the signing files
        if: always()
        run: rm -rf "$RUNNER_TEMP/harmony-keys"

      - name: Files
        run: ls -l dist unsigned >>"$GITHUB_STEP_SUMMARY" 2>&1 || true

      - uses: actions/upload-artifact@v4
        with:
          name: release-harmonyos
          path: dist/*
          if-no-files-found: error

  # the iPad app is unfinished: built on manual runs only, never released
  ipados:
    name: iPadOS (unsigned IPA)
    if: ${{ !github.event.repository.private && github.event_name == 'workflow_dispatch' }}
    continue-on-error: true
    runs-on: macos-15
    env:
      DIST: ${{ github.workspace }}/dist
    steps:
      - uses: actions/checkout@v4

      - id: v
        name: Resolve version
        run: |
          listed="$(sed -n 's/^procraft\.version=//p' android/gradle.properties | tr -d '\r')"
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="$listed"; fi
          echo "version=$v" >>"$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-ipados

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build the IPA
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: bash ios/build-ipa.sh

      - name: Files
        run: ls -l dist >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ipados-unreleased
          path: dist/*
          if-no-files-found: error

  # Windows on ARM: cross-built on the x64 runner, which has Visual Studio's ARM64 build tools
  windows-arm64:
    name: Desktop (windows-arm64)
    runs-on: windows-2025
    continue-on-error: true
    defaults:
      run:
        shell: bash
    env:
      DIST: ${{ github.workspace }}/dist
    steps:
      - uses: actions/checkout@v4

      - id: v
        name: Resolve version
        run: |
          listed="$(sed -n 's/^procraft\.version=//p' android/gradle.properties | tr -d '\r')"
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="$listed"; fi
          echo "version=$v" >>"$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-desktop-windows-arm64

      - name: Install WiX v5
        run: |
          dotnet tool install --global wix --version 5.0.2
          echo "$USERPROFILE/.dotnet/tools" >>"$GITHUB_PATH"
          "$USERPROFILE/.dotnet/tools/wix" extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2

      - name: Package for Windows on ARM
        shell: pwsh
        env:
          VERSION: ${{ steps.v.outputs.version }}
          ARCH: arm64
        run: ./packaging/windows/package.ps1

      - name: Files
        run: ls -l dist >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: release-desktop-windows-arm64
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [apk, desktop, windows-arm64, macos, harmony, ipados]
    # the Mac, HarmonyOS and Windows on ARM jobs may have been skipped (a private repository, their
    # variable unset) or left out their files; the iPad's is skipped
    if: ${{ github.ref_type == 'tag' && !cancelled() && needs.apk.result == 'success' && needs.desktop.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Checksums
        run: (cd dist && sha256sum -- * >SHA256SUMS.txt && cat SHA256SUMS.txt >>"$GITHUB_STEP_SUMMARY")

      - name: Draft the release
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes "## What's Changed" -- dist/*
          echo "Draft **$GITHUB_REF_NAME** is ready: fill in What's Changed and publish it." >>"$GITHUB_STEP_SUMMARY"
